name: Quality

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify production site contracts
        env:
          SITE_URL: http://127.0.0.1:3000
        run: |
          npm start -- --hostname 127.0.0.1 --port 3000 > /tmp/marwan-portfolio.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$SITE_URL" > /dev/null; then
              npm run verify
              exit 0
            fi
            sleep 1
          done
          cat /tmp/marwan-portfolio.log
          exit 1
